# Pre-commit configuration for leisure-watch, modelled on steam-backlog-enforcer.
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
#
# kuhytrack/ is a git-subtree import with its own gates; the root gates leave
# it alone rather than restructuring it.
exclude: ^kuhytrack/

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

default_install_hook_types: [pre-commit, pre-push, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: check-builtin-literals
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-format
        exclude: ^scripts/file_length/
        types_or: [python, pyi]

  - repo: local
    hooks:

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*); shared gate.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false

      # Every dependency on its ecosystem's newest STABLE release. Runs
      # without --strict: offline it degrades to the cached answer. CI skips
      # this check (runs locally only).
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pyproject\.toml|requirements.*\.txt|package\.json
          |\.python-version|\.github/workflows/.*\.ya?ml)$

      # The only pre-push hook: finish_auto.sh stamps HEAD after its gate.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$
