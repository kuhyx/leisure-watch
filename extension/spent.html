<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>⏳</title>
    <style>
      /* unified-design-system tokens: ink / text-on-dark / muted / warning */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #211d1b;
        color: #eceae9;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 32px;
        border: 1px solid #463e3a;
        border-radius: 8px;
        background: #2b2624;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.2;
        color: #e0a63c;
      }
      p {
        margin: 0 0 8px;
      }
      .muted {
        color: #aaa09a;
      }
    </style>
  </head>
  <body>
    <main>
        <div aria-hidden="true">
          <!-- clock + hourglass icon -->
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e0a63c" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e0a63c" stroke-width="2"><path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/></svg>
        </div>
        <p><strong id="used">?</strong> / <strong id="budget">?</strong> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></p>
        <p><!-- block glyph --><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="site"></span></p>
        <p class="muted"><!-- allowlist + 06:00 --><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></p>
    </main>
    <script src="spent.js"></script>
  </body>
</html>
