name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The package itself is stdlib-only; [dev] is the exact-pinned toolchain.
      - name: Install the dev toolchain
        run: python -m pip install ".[dev]"

      - name: Run tests with 100% branch coverage
        run: python -m pytest --cov=leisure_watch --cov-branch --cov-fail-under=100

      - name: Type-check (strict)
        run: python -m mypy leisure_watch tests

      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
